<!-- ════════════════════════════════════════════════════════
  pest.html — Pest Surveillance (DA DOS KOLEK design)
════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pest Surveillance — DA-RFO2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">Pest Surveillance</span>
      <span class="topbar-subtitle">— KoboToolbox / DA DOS KOLEK Design</span>
      <span id="alert-badge" class="topbar-badge alert" style="display:none"></span>
    </div>
    <div class="page-body" id="page-body"></div>
  </div>
</div>
<div id="toast-container"></div>
<div class="modal-overlay hidden" id="pest-modal">
  <div class="modal-box">
    <div class="modal-header">Submit Pest Surveillance Report <button class="modal-close" onclick="closeModal('pest-modal')">x</button></div>
    <div class="modal-body">
      <div style="background:var(--blue-100);padding:8px 12px;border-radius:4px;font-size:.78rem;color:var(--blue-500);margin-bottom:12px">
        📡 This form simulates KoboToolbox offline submission (DA DOS KOLEK design). GPS and photo fields are recorded.
      </div>
      <div class="form-grid cols-2">
        <div class="form-group"><label class="form-label">AEW Name<span class="req">*</span></label><input id="ps-aew" placeholder="AEW-Municipality-01"></div>
        <div class="form-group"><label class="form-label">Province</label><select id="ps-province"><option>Isabela</option><option>Cagayan</option><option>Nueva Vizcaya</option><option>Quirino</option></select></div>
        <div class="form-group"><label class="form-label">Municipality<span class="req">*</span></label><input id="ps-muni"></div>
        <div class="form-group"><label class="form-label">Barangay</label><input id="ps-barangay"></div>
        <div class="form-group"><label class="form-label">Observation Date<span class="req">*</span></label><input id="ps-date" type="date"></div>
        <div class="form-group"><label class="form-label">Crop Type<span class="req">*</span></label>
          <select id="ps-crop"><option>Mungbean</option><option>Peanut</option><option>Watermelon</option><option>Onion</option><option>Ube</option><option>Mango</option><option>Rice</option><option>Corn</option></select></div>
        <div class="form-group"><label class="form-label">Growth Stage</label>
          <select id="ps-stage"><option>Germination</option><option>Vegetative</option><option>Flowering</option><option>Pod-filling</option><option>Maturity</option></select></div>
        <div class="form-group"><label class="form-label">Pest / Disease Observed</label>
          <select id="ps-pest"><option value="None">None</option><option>Aphids</option><option>Thrips</option><option>Armyworm</option><option>Leaf curl virus</option><option>Damping off</option><option>Mango hoppers</option><option>Root rot</option><option>Blight</option><option>Other</option></select></div>
        <div class="form-group"><label class="form-label">Severity<span class="req">*</span></label>
          <select id="ps-severity"><option>None</option><option>Low</option><option>Moderate</option><option>High</option><option>Severe</option></select></div>
        <div class="form-group"><label class="form-label">% Crop Area Affected</label><input id="ps-pct" type="number" min="0" max="100" value="0"></div>
        <div class="form-group"><label class="form-label">Overall Crop Condition<span class="req">*</span></label>
          <select id="ps-condition"><option>Healthy</option><option>Stressed</option><option>Wilting</option><option>Dying</option></select></div>
        <div class="form-group"><label class="form-label">Intervention Received?</label>
          <select id="ps-interv"><option value="true">Yes</option><option value="false">No</option></select></div>
        <div class="form-group"><label class="form-label">GPS Latitude</label><input id="ps-lat" type="number" step="0.0001" placeholder="e.g. 17.1441"></div>
        <div class="form-group"><label class="form-label">GPS Longitude</label><input id="ps-lng" type="number" step="0.0001" placeholder="e.g. 121.8894"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('pest-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="savePest()">Submit Report</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar('pest.html');
  document.getElementById('ps-date').value = new Date().toISOString().split('T')[0];
  render();
});

function render() {
  const pests = DB.get(DB.KEYS.PEST);
  const high  = pests.filter(p=>p.severity==='High'||p.severity==='Severe');
  const badge = document.getElementById('alert-badge');
  if (high.length) { badge.textContent=`${high.length} ALERT`; badge.style.display='inline-flex'; }
  else badge.style.display='none';

  const munis = [...new Set(pests.map(p=>p.municipality))];
  const sevMap = {};
  pests.forEach(p => { sevMap[p.severity] = (sevMap[p.severity]||0)+1; });
  const cropMap = {};
  pests.forEach(p => { cropMap[p.crop] = (cropMap[p.crop]||0)+1; });

  document.getElementById('page-body').innerHTML = `
    ${high.length?`<div class="alert-banner red">${ICONS.alert}<div><strong>HIGH/SEVERE PEST INCIDENCE DETECTED:</strong><br>${high.map(p=>`• ${p.municipality} (${AccessPolicy.isPublic()?'Barangay withheld':(p.barangay||'N/A')}) — ${p.pestObserved}, ${p.pctAffected}% affected, crop: ${p.cropCondition}`).join('<br>')}<br><strong>Action required: BCA deployment, AEW advisory, escalate to Regulatory.</strong></div></div>`:''}

    <div class="kpi-grid cols-4" style="margin-bottom:16px">
      <div class="kpi-tile blue"><div class="kpi-label">Total Reports</div><div class="kpi-value">${pests.length}</div></div>
      <div class="kpi-tile ${high.length?'red':''}"><div class="kpi-label">High/Severe Alerts</div><div class="kpi-value">${high.length}</div></div>
      <div class="kpi-tile"><div class="kpi-label">Municipalities Covered</div><div class="kpi-value">${munis.length}</div></div>
      <div class="kpi-tile amber"><div class="kpi-label">AEWs Reporting</div><div class="kpi-value">${[...new Set(pests.map(p=>p.aew))].length}</div></div>
    </div>

    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Reports by Severity</div>
        <div id="sev-chart"></div>
      </div>
      <div class="card">
        <div class="card-title">Reports by Crop Type</div>
        <div id="crop-chart"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">Pest Surveillance Reports <small>${pests.length} submissions</small></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="exportCSV(DB.get(DB.KEYS.PEST),'pest_surveillance.csv')">${ICONS.download} CSV</button>
          <button class="btn btn-primary btn-sm" data-access="write" onclick="openModal('pest-modal')">${ICONS.plus} Submit Report</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>AEW</th><th>Municipality</th><th>Barangay</th><th>Crop</th><th>Stage</th><th>Pest/Disease</th><th>Severity</th><th>% Affected</th><th>Crop Condition</th><th>Intervention?</th><th>GPS</th><th>Act.</th></tr></thead>
          <tbody>
            ${pests.length===0?'<tr><td colspan="13" style="text-align:center;color:var(--gray-400)">No reports yet</td></tr>':
              pests.map(p=>`<tr ${p.severity==='High'||p.severity==='Severe'?'style="background:var(--red-100)"':''}>
                <td>${fmt.date(p.date)}</td>
                <td style="font-size:.76rem">${AccessPolicy.isPublic()?'Withheld':p.aew}</td>
                <td><strong>${p.municipality}</strong></td>
                <td style="font-size:.76rem">${AccessPolicy.isPublic()?'Withheld':(p.barangay||'—')}</td>
                <td>${p.crop}</td>
                <td style="font-size:.76rem">${p.growthStage}</td>
                <td>${p.pestObserved||'None'}</td>
                <td>${fmt.statusBadge(p.severity||'None')}</td>
                <td style="font-family:var(--font-mono)">${p.pctAffected}%</td>
                <td>${fmt.statusBadge(p.cropCondition)}</td>
                <td>${p.interventionReceived?'<span class="badge green">Yes</span>':'<span class="badge red">No</span>'}</td>
                <td style="font-size:.72rem;font-family:var(--font-mono)">${AccessPolicy.isPublic()?'Withheld':(p.lat?`${p.lat},${p.lng}`:'—')}</td>
                <td><button class="btn btn-danger btn-sm" data-access="admin" onclick="delPest('${p.id}')">${ICONS.trash}</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const sevs=['None','Low','Moderate','High','Severe'];
  const sevColors={'None':'var(--green-500)','Low':'var(--green-400)','Moderate':'var(--gold-400)','High':'var(--orange-500)','Severe':'var(--red-500)'};
  const sevVals=sevs.map(s=>sevMap[s]||0);
  renderBarChart('sev-chart', sevs, sevVals);
  document.querySelectorAll('#sev-chart .mini-bar-col, #sev-chart div[style*="background"]').forEach((el,i)=>{});
  renderBarChart('crop-chart', Object.keys(cropMap), Object.values(cropMap), 'var(--blue-500)');
}

function savePest() {
  const aew=document.getElementById('ps-aew').value.trim();
  const muni=document.getElementById('ps-muni').value.trim();
  const date=document.getElementById('ps-date').value;
  if(!aew||!muni||!date){toast('AEW, municipality, and date required','error');return;}
  DB.add(DB.KEYS.PEST, {
    aew, province:document.getElementById('ps-province').value,
    municipality:muni, barangay:document.getElementById('ps-barangay').value.trim(),
    date, crop:document.getElementById('ps-crop').value,
    growthStage:document.getElementById('ps-stage').value,
    pestObserved:document.getElementById('ps-pest').value,
    severity:document.getElementById('ps-severity').value,
    pctAffected:+document.getElementById('ps-pct').value,
    cropCondition:document.getElementById('ps-condition').value,
    interventionReceived:document.getElementById('ps-interv').value==='true',
    lat:+document.getElementById('ps-lat').value||null,
    lng:+document.getElementById('ps-lng').value||null,
  });
  closeModal('pest-modal'); toast('Pest report submitted'); render();
}
function delPest(id){if(!confirm('Delete?'))return;DB.remove(DB.KEYS.PEST,id);render();}
</script>
</body>
</html>
