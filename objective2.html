<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO2 – Technologies & R4D — DA-RFO2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">Specific Objective 2</span>
      <span class="topbar-subtitle">— Technologies, R4D &amp; Superimposed Trials</span>
      <span class="topbar-badge">SO2 Monitor</span>
    </div>
    <div class="page-body" id="page-body"></div>
  </div>
</div>
<div id="toast-container"></div>
<!-- Trial modal -->
<div class="modal-overlay hidden" id="trial-modal">
  <div class="modal-box">
    <div class="modal-header">Add Superimposed Trial Record <button class="modal-close" onclick="closeModal('trial-modal')">×</button></div>
    <div class="modal-body">
      <div class="form-grid cols-2">
        <div class="form-group"><label class="form-label">Province<span class="req">*</span></label>
          <select id="tr-province"><option>Isabela</option><option>Cagayan</option><option>Nueva Vizcaya</option><option>Quirino</option></select></div>
        <div class="form-group"><label class="form-label">Municipality<span class="req">*</span></label><input id="tr-municipality"></div>
        <div class="form-group"><label class="form-label">Crop<span class="req">*</span></label>
          <select id="tr-crop"><option>Mungbean</option><option>Peanut</option><option>Watermelon</option><option>Onion</option><option>Ube</option></select></div>
        <div class="form-group"><label class="form-label">Variety</label><input id="tr-variety" placeholder="e.g. Pag-asa 7"></div>
        <div class="form-group"><label class="form-label">Package of Technology (POT)<span class="req">*</span></label>
          <select id="tr-pot"><option>Zero Tillage + Biofertilizer</option><option>Zero Tillage only</option><option>Biofertilizer + BCA</option><option>Full Package (Zero Tillage + Biofertilizer + BCA)</option><option>Biofertilizer only</option></select></div>
        <div class="form-group"><label class="form-label">Farmer / FCA</label><input id="tr-farmer"></div>
        <div class="form-group"><label class="form-label">Planting Date</label><input id="tr-date" type="date"></div>
        <div class="form-group"><label class="form-label">Current Growth Stage</label>
          <select id="tr-stage"><option>Germination</option><option>Vegetative</option><option>Flowering</option><option>Pod-filling</option><option>Maturity</option></select></div>
        <div class="form-group"><label class="form-label">Cost (Conventional ₱/ha)</label><input id="tr-cost-conv" type="number" value="5000"></div>
        <div class="form-group"><label class="form-label">Cost (POT ₱/ha)</label><input id="tr-cost-pot" type="number" value="3000"></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Baseline Conditions</label>
        <textarea id="tr-baseline" placeholder="Soil type, drought level, rainfall, etc."></textarea></div>
      <div class="form-group" style="margin-top:8px"><label class="form-label">Lessons / Observations</label>
        <textarea id="tr-lessons"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('trial-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTrial()">Save Trial</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar('objective2.html');
  render();
});

function render() {
  const techs  = DB.get(DB.KEYS.TECH);
  const trials = DB.get(DB.KEYS.TRIALS);

  const byType = type => techs.filter(t=>t.type===type);
  const types  = ['INS-1hp','INS-2hp','INS-3hp','Rain Shelter','SPIS'];
  const typeCounts = types.map(t=>byType(t).length);
  const funcCounts = types.map(t=>byType(t).filter(x=>x.functional).length);

  const functional   = techs.filter(t=>t.functional).length;
  const nonFunc      = techs.filter(t=>!t.functional).length;
  const totalArea    = techs.filter(t=>t.functional).reduce((s,t)=>s+(t.areaServed||0),0);
  const funcRate     = techs.length>0 ? Math.round(functional/techs.length*100) : 0;

  const avgSaving = trials.length>0
    ? Math.round(trials.reduce((s,t)=>s+(t.costConventional-t.costPOT),0)/trials.length) : 0;

  document.getElementById('page-body').innerHTML = `
    <div class="kpi-grid cols-4" style="margin-bottom:16px">
      <div class="kpi-tile blue"><div class="kpi-label">Technology Sites</div><div class="kpi-value">${techs.length}</div><div class="kpi-sub">${types.map(t=>`${t}:${byType(t).length}`).join(' · ')}</div></div>
      <div class="kpi-tile ${rateColor(funcRate)}"><div class="kpi-label">Functionality Rate</div><div class="kpi-value">${funcRate}%</div>
        <div style="margin-top:6px"><div class="progress-bar-wrap"><div class="progress-bar-fill ${rateColor(funcRate)}" style="width:${funcRate}%"></div></div></div></div>
      <div class="kpi-tile"><div class="kpi-label">Area Served</div><div class="kpi-value">${totalArea.toFixed(1)}</div><div class="kpi-sub">hectares (functional only)</div></div>
      <div class="kpi-tile amber"><div class="kpi-label">Superimposed Trials</div><div class="kpi-value">${trials.length}</div><div class="kpi-sub">Avg. ₱${avgSaving.toLocaleString()}/ha savings</div></div>
    </div>

    ${nonFunc>0?`<div class="alert-banner red">${ICONS.alert}<div><strong>${nonFunc} non-functional unit(s)</strong> require immediate corrective action. Check the table below for details.</div></div>`:''}

    <!-- Charts -->
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Technology Units Installed vs Functional</div>
        <div style="display:flex;gap:16px;align-items:flex-end;padding:8px 0">
          ${types.map((type,i)=>`
            <div style="flex:1;text-align:center">
              <div style="display:flex;gap:4px;justify-content:center;align-items:flex-end;height:100px">
                <div style="flex:1;background:var(--blue-100);border-radius:3px 3px 0 0;height:${typeCounts[i]*20}px;position:relative;display:flex;align-items:flex-end;justify-content:center">
                  <span style="font-size:.65rem;color:var(--blue-500);font-weight:700;padding-bottom:2px">${typeCounts[i]}</span>
                </div>
                <div style="flex:1;background:var(--green-400);border-radius:3px 3px 0 0;height:${funcCounts[i]*20}px;position:relative;display:flex;align-items:flex-end;justify-content:center">
                  <span style="font-size:.65rem;color:white;font-weight:700;padding-bottom:2px">${funcCounts[i]}</span>
                </div>
              </div>
              <div style="font-size:.66rem;color:var(--gray-500);margin-top:4px">${type}</div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:6px;font-size:.7rem;color:var(--gray-500)">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:var(--blue-100);display:inline-block;border-radius:2px"></span>Installed</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:var(--green-400);display:inline-block;border-radius:2px"></span>Functional</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Cost Reduction — POT vs Conventional (₱/ha)</div>
        <div id="cost-chart"></div>
      </div>
    </div>

    <!-- Technology table -->
    <div class="card" style="margin-bottom:16px">
      <div class="section-header">
        <div class="section-title">Technology Installation & Functionality Records <small>${techs.length} units</small></div>
        <a href="technology.html" class="btn btn-primary btn-sm" data-access="write">${ICONS.plus} Add / Update Unit</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Municipality</th><th>Province</th><th>Beneficiary</th><th>Installed</th><th>Status</th><th>Area Served</th><th>Issue</th><th>Last Check</th></tr></thead>
          <tbody>
            ${techs.length===0?'<tr><td colspan="9" style="text-align:center;color:var(--gray-400)">No technology records</td></tr>':
              techs.map(t=>`<tr>
                <td><span class="badge blue">${t.type}</span></td>
                <td>${t.municipality}</td><td>${t.province}</td>
                <td>${AccessPolicy.personName(t.beneficiary, 'Beneficiary/FCA withheld')}</td>
                <td>${fmt.date(t.installDate)}</td>
                <td>${fmt.statusBadge(t.functional?'Functional':'Non-functional')}</td>
                <td>${t.functional?(t.areaServed+' ha'):'—'}</td>
                <td style="font-size:.76rem;color:var(--red-500)">${t.issue||'—'}</td>
                <td style="font-size:.76rem">${fmt.date(t.lastCheck)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Trials table -->
    <div class="card">
      <div class="section-header">
        <div class="section-title">Superimposed Trial & POT Records <small>${trials.length} trials</small></div>
        <button class="btn btn-primary btn-sm" data-access="write" onclick="openModal('trial-modal')">${ICONS.plus} Add Trial</button>
      </div>
      ${trials.length===0?'<div class="empty-state"><p>No trial records yet.</p></div>':
      `<div class="table-wrap">
        <table>
          <thead><tr><th>Municipality</th><th>Province</th><th>Crop</th><th>POT Applied</th><th>Farmer/FCA</th><th>Stage</th><th>Conv. Cost ₱/ha</th><th>POT Cost ₱/ha</th><th>Saving</th><th>Lessons</th></tr></thead>
          <tbody>
            ${trials.map(t=>`<tr>
              <td>${t.municipality}</td><td>${t.province}</td>
              <td><strong>${t.crop}</strong> <span style="font-size:.72rem;color:var(--gray-500)">${t.variety||''}</span></td>
              <td style="font-size:.76rem">${t.pot}</td>
              <td>${AccessPolicy.personName(t.farmer, 'Farmer/FCA withheld')}</td>
              <td><span class="badge ${t.currentStatus==='Maturity'?'green':'gray'}">${t.currentStatus}</span></td>
              <td style="font-family:var(--font-mono)">₱${Number(t.costConventional).toLocaleString()}</td>
              <td style="font-family:var(--font-mono)">₱${Number(t.costPOT).toLocaleString()}</td>
              <td style="font-family:var(--font-mono);color:var(--green-700);font-weight:600">₱${Number(t.costConventional-t.costPOT).toLocaleString()}</td>
              <td style="font-size:.74rem;max-width:200px">${t.lessonsNoted||'—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;

  // Cost chart
  if (trials.length) {
    renderBarChart('cost-chart',
      trials.map(t=>t.municipality.substring(0,8)),
      trials.map(t=>t.costConventional-t.costPOT),
      'var(--green-500)'
    );
  } else {
    document.getElementById('cost-chart').innerHTML = '<div class="empty-state"><p>No trial data yet</p></div>';
  }
}

function saveTrial() {
  const record = {
    province: document.getElementById('tr-province').value,
    municipality: document.getElementById('tr-municipality').value.trim(),
    crop: document.getElementById('tr-crop').value,
    variety: document.getElementById('tr-variety').value.trim(),
    pot: document.getElementById('tr-pot').value,
    farmer: document.getElementById('tr-farmer').value.trim(),
    plantingDate: document.getElementById('tr-date').value,
    currentStatus: document.getElementById('tr-stage').value,
    costConventional: +document.getElementById('tr-cost-conv').value,
    costPOT: +document.getElementById('tr-cost-pot').value,
    baseline: document.getElementById('tr-baseline').value.trim(),
    lessonsNoted: document.getElementById('tr-lessons').value.trim(),
    yieldEst: 0,
  };
  if (!record.municipality) { toast('Municipality is required','error'); return; }
  const saved = DB.add(DB.KEYS.TRIALS, record);
  if (!saved) return;
  closeModal('trial-modal');
  toast('Trial record saved');
  render();
}
</script>
</body>
</html>
